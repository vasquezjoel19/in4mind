<!DOCTYPE html>
<html lang="es" data-i18n-title="meta.projectsTitle" data-requires-auth>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="IN4MIND — Mis proyectos de aprendizaje.">
  <title>IN4MIND — Mis Proyectos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="src/js/dist/boot.bundle.js?v=20260820notes1"></script>

  <link rel="stylesheet" href="src/css/tokens.css?v=20260812polish">
  <link rel="stylesheet" href="src/css/base.css?v=20260714fluid3">
  <link rel="stylesheet" href="src/css/dashboard.css?v=20260818emp42">
  <link rel="stylesheet" href="src/css/responsive.css?v=20260812polish">
  <link rel="stylesheet" href="src/css/projects.css?v=20260820notes1">
  <link rel="stylesheet" href="src/css/theme.css?v=20260817emp36">
  <link rel="stylesheet" href="src/css/ui-polish.css?v=20260813workspace">
  <link rel="stylesheet" href="src/css/accessibility.css?v=20260707">
  <link rel="stylesheet" href="src/css/i18n.css?v=20260812polish">
  <link rel="stylesheet" href="src/css/settings-modal.css?v=20260812polish">
  <link rel="stylesheet" href="src/css/app-features.css?v=20260812polish">
  <link rel="stylesheet" href="src/css/global-chat.css?v=20260812polish">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="64x64" href="src/img/brand/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="src/img/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="src/img/brand/favicon-16.png">
  <link rel="apple-touch-icon" href="src/img/brand/apple-touch-icon.png">
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

<div class="dashboard">
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Menú principal" data-i18n-aria="shell.mainMenu">
    <div class="sidebar__brand">
      <div class="sidebar__brand-main">
        <svg class="sidebar__brand-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="9" y1="18" x2="15" y2="18"/><line x1="10" y1="22" x2="14" y2="22"/>
          <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0018 8 6 6 0 006 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 018.91 14"/>
        </svg>
        <span class="sidebar__brand-name">IN4MIND</span>
      </div>
      <button type="button" class="sidebar__collapse-btn" id="sidebar-collapse" aria-label="Colapsar menú" data-i18n-aria="shell.collapseMenu" aria-expanded="true">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>
    <ul class="sidebar__nav" id="sidebar-nav" role="menubar" aria-label="Navegación principal" data-i18n-aria="shell.mainNav"></ul>
    <div class="sidebar__footer">
      <ul id="sidebar-footer" role="menubar" aria-label="Opciones de cuenta" data-i18n-aria="shell.accountOptions"></ul>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar" role="banner">
      <button class="menu-toggle icon-btn" id="menu-toggle" aria-label="Abrir menú" data-i18n-aria="shell.openMenu" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="search-bar" role="search">
        <svg class="search-bar__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-bar__input" type="search" id="projects-search" placeholder="Buscar proyectos…" data-i18n-placeholder="projects.searchPlaceholder" aria-label="Buscar proyectos" data-i18n-aria="projects.searchAria">
      </div>
      <div class="topbar__actions">
        <button type="button" class="btn--quiz-share" id="projects-btn-share" data-share aria-label="Compartir" data-i18n-aria="share.projects">↗</button>
        <a class="icon-btn" href="help.html" aria-label="Ayuda" data-i18n-aria="shell.help">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </a>
        <a class="avatar" id="avatar" href="profile.html" aria-label="Ir a mi perfil" data-i18n-aria="shell.myProfile">U</a>
      </div>
    </header>

    <main class="content-area content-area--workspace">
      <div id="projects-list-view">
        <div class="projects-page-header workspace-page-header anim-fade-up">
          <div class="projects-page-header__brand workspace-page-header__brand">
            <span class="in4mind-bulb projects-page-header__logo" aria-hidden="true"></span>
            <div>
              <h1 data-i18n="projects.pageTitle">Mis Proyectos</h1>
              <p class="workspace-page-header__sub" data-i18n="projects.pageSub">Organiza tu aprendizaje con tareas, notas y cursos vinculados.</p>
            </div>
          </div>
          <div class="workspace-page-header__actions">
            <button type="button" class="btn--course btn--lg" id="projects-new-btn" data-i18n="projects.newProject">Nuevo proyecto</button>
          </div>
        </div>
        <div class="projects-grid anim-fade-up delay-1" id="projects-grid" role="list"></div>
      </div>

      <div id="projects-detail-view" class="projects-view--hidden">
        <div id="projects-detail"></div>
      </div>
    </main>
  </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="src/js/config/supabase.config.js"></script>
<script defer src="src/js/dist/app-shell.bundle.js?v=20260820notes1"></script>
<script defer src="src/js/data/CourseCurriculum.js?v=20260805"></script>
<script defer src="src/js/services/LessonNotesService.js?v=20260820notes1"></script>
<script defer src="src/js/services/NotesService.js?v=20260820notes1"></script>
<script defer src="src/js/services/ProjectsService.js?v=20260820notes1"></script>
<script defer src="src/js/controllers/ProjectsController.js?v=20260820notes1"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    try { AppShell.initPage('projects'); } catch (e) { console.error(e); AppShell.setupAvatar(); }
    try { ProjectsController.init(); } catch (e) { console.error(e); }
  });
</script>
</body>
</html>

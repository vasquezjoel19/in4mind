name: CI

on:
  push:
    branches: [develop, main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ESLint vive en la raíz para cubrir también las funciones de /api.
      - name: Install dependencies
        run: npm install

      - name: ESLint
        run: npm run lint

  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: in4mind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # esbuild (minificador) llega por aquí: sin instalar, el build generaría
      # bundles sin minificar y la comprobación de minificado fallaría.
      - name: Install dependencies
        run: npm install

      - name: Build shell bundles
        run: npm run build:shell

      # Los hashes de la CSP viven en vercel.json y se calculan desde el HTML:
      # si alguien toca un script inline y no regenera, se bloquearía en el
      # navegador. Mejor que falle aquí.
      - name: Check CSP is in sync
        run: npm run check:csp

      - name: Unit tests
        run: npm test

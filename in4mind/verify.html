<!DOCTYPE html>
<html lang="es" data-i18n-title="cert.verifyPageTitle">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Verifica certificaciones IN4MIND">
  <title>IN4MIND — Verificar certificado</title>
  <script src="src/js/controllers/ThemeController.js"></script>
  <script src="src/js/a11y-boot.js?v=20260707"></script>
  <script src="src/js/locales/es.js?v=20260805"></script>
  <script src="src/js/locales/en.js?v=20260805"></script>
  <script src="src/js/locales/zh.js?v=20260805"></script>
  <script src="src/js/services/I18n.js"></script>
  <script>ThemeController.initEarly(); I18n.initEarly();</script>
  <link rel="stylesheet" href="src/css/tokens.css">
  <link rel="stylesheet" href="src/css/base.css?v=20260714fluid3">
  <link rel="stylesheet" href="src/css/theme.css?v=20260805">
  <link rel="stylesheet" href="src/css/accessibility.css?v=20260707">
  <link rel="stylesheet" href="src/css/settings-modal.css?v=20260714theme">
  <style>
    .verify-topbar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; z-index: 10; }
    .verify-topbar__brand { font-weight: 700; color: var(--clr-brand-600, #4a76b2); text-decoration: none; }
    .verify-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 72px 24px 24px; background: var(--clr-surface-muted, #f4f6fb); }
    .verify-card { max-width: 480px; width: 100%; background: var(--clr-surface-elevated, #fff); border-radius: 20px; padding: 32px; box-shadow: 0 8px 32px rgba(0,0,0,.08); text-align: center; }
    .verify-card h1 { font-size: 1.5rem; margin-bottom: 8px; }
    .verify-card input { width: 100%; padding: 14px; border: 1px solid var(--clr-border); border-radius: 12px; margin: 16px 0; font-size: 1rem; text-transform: uppercase; }
    .verify-card button { width: 100%; padding: 14px; background: var(--clr-brand-600, #4a76b2); color: #fff; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; }
    .verify-result { margin-top: 24px; text-align: left; }
    .verify-result p { margin: 8px 0; }
    .verify-back { display: inline-block; margin-top: 20px; color: var(--clr-brand-600); }
  </style>
</head>
<body>

  <header class="verify-topbar">
    <a href="index.html" class="verify-topbar__brand">IN4MIND</a>
    <button type="button" class="in4-other-trigger" data-open-other-menu data-i18n-aria="nav.other">
      <span data-i18n="nav.other">Otros</span>
    </button>
  </header>

  <main class="verify-page" id="main">
    <div class="verify-card">
      <h1 data-i18n="cert.verifyTitle">Verificar certificado</h1>
      <p data-i18n="cert.verifySub">Introduce el código del certificado IN4MIND.</p>
      <input type="text" id="verify-code" placeholder="IN4-XXXXXXXX" autocomplete="off">
      <button type="button" id="verify-btn" data-i18n="cert.verifyBtn">Verificar</button>
      <div id="verify-result" class="verify-result" hidden></div>
      <a href="index.html" class="verify-back" data-i18n="common.backHome">Volver a Home</a>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="src/js/config/supabase.config.js"></script>
  <script src="src/js/services/CertVerificationService.js"></script>
  <script src="src/js/i18n-boot.js"></script>
  <script src="src/js/controllers/OtherMenuController.js?v=20260714theme"></script>
  <script src="src/js/other-menu-boot.js?v=20260707"></script>
  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const input = document.getElementById('verify-code');
    const result = document.getElementById('verify-result');
    if (params.get('code')) input.value = params.get('code');

    function t(k, fb) { return typeof I18n !== 'undefined' ? I18n.t(k) : fb; }

    async function run() {
      const code = input.value.trim();
      if (!code) return;
      const data = await CertVerificationService.verify(code);
      result.hidden = false;
      if (!data) {
        result.innerHTML = `<span class="cert-verify-badge cert-verify-badge--invalid">${t('cert.verifyInvalid', 'Certificado no encontrado')}</span>`;
        return;
      }
      const date = new Date(data.earnedAt).toLocaleDateString();
      result.innerHTML = `
        <span class="cert-verify-badge">${t('cert.verifyValid', 'Certificado válido')}</span>
        <p><strong>${t('cert.holder', 'Titular')}:</strong> ${data.userName}</p>
        <p><strong>${t('cert.course', 'Curso')}:</strong> ${data.course}</p>
        <p><strong>${t('cert.issued', { date }, 'Emitido')}</strong></p>
        <p><strong>${t('cert.code', { code: data.code }, 'Código')}:</strong></p>`;
    }

    document.getElementById('verify-btn').addEventListener('click', run);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
    if (params.get('code')) run();
  })();
  </script>
<script src="src/js/services/CursorSpotlight.js?v=20260714fluid4"></script>
<script>document.addEventListener('DOMContentLoaded',()=>{ if(typeof CursorSpotlight!=='undefined') CursorSpotlight.init({ intensity:'app' }); });</script>
</body>
</html>

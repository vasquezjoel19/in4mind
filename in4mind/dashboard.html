<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IN4MIND Dashboard — Explora cursos y tutoriales de tecnología.">
  <title>IN4MIND — Dashboard</title>

  <script src="src/js/controllers/ThemeController.js?v=20260617"></script>
  <script>ThemeController.initEarly();</script>

  <!-- Estilos -->
  <link rel="stylesheet" href="src/css/tokens.css?v=20260706">
  <link rel="stylesheet" href="src/css/base.css?v=20260617">
  <link rel="stylesheet" href="src/css/dashboard.css?v=20260704">
  <link rel="stylesheet" href="src/css/responsive.css?v=20260613">
  <link rel="stylesheet" href="src/css/theme.css?v=20260706">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>💡</text></svg>">
</head>
<body>

<!-- Overlay para sidebar móvil -->
<div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

<div class="dashboard">

  <!-- ══════════════════════════════════════
       SIDEBAR
  ══════════════════════════════════════ -->
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Menú principal">

    <!-- Marca -->
    <div class="sidebar__brand">
      <div class="sidebar__brand-main">
        <svg class="sidebar__brand-icon" width="28" height="28" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="9" y1="18" x2="15" y2="18"/>
          <line x1="10" y1="22" x2="14" y2="22"/>
          <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0018 8 6 6 0 006 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 018.91 14"/>
        </svg>
        <span class="sidebar__brand-name">IN4MIND</span>
      </div>
      <button type="button" class="sidebar__collapse-btn" id="sidebar-collapse"
              aria-label="Colapsar menú" aria-expanded="true">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
    </div>

    <!-- Nav principal (renderizado por DashboardController) -->
    <ul class="sidebar__nav" id="sidebar-nav" role="menubar" aria-label="Navegación principal">
      <!-- Ítems generados dinámicamente -->
    </ul>

    <!-- Nav footer -->
    <div class="sidebar__footer">
      <ul id="sidebar-footer" role="menubar" aria-label="Opciones de cuenta">
        <!-- Ítems generados dinámicamente -->
      </ul>
    </div>
  </aside>

  <!-- ══════════════════════════════════════
       ÁREA PRINCIPAL
  ══════════════════════════════════════ -->
  <div class="main-area">

    <!-- Top Bar -->
    <header class="topbar" role="banner">
      <!-- Hamburger (móvil) -->
      <button class="menu-toggle icon-btn" id="menu-toggle"
              aria-label="Abrir menú" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <!-- Colapsar sidebar (escritorio) -->
      <button type="button" class="icon-btn sidebar-top-toggle" id="sidebar-collapse-top"
              aria-label="Colapsar menú" aria-expanded="true">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
      </button>

      <!-- Barra de búsqueda -->
      <div class="search-bar" role="search">
        <svg class="search-bar__icon" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input class="search-bar__input" type="search" id="search-input"
               placeholder="Búsqueda de tutoriales, temas u otros..."
               aria-label="Buscar cursos">
      </div>

      <!-- Acciones -->
      <div class="topbar__actions">
        <button class="icon-btn" aria-label="Ayuda">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </button>
        <button class="icon-btn" aria-label="Notificaciones">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 01-3.46 0"/>
          </svg>
        </button>
        <!-- Avatar del usuario (letra inicial) -->
        <a class="avatar" id="avatar" href="profile.html" aria-label="Ir a mi perfil">U</a>
      </div>
    </header>

    <!-- Contenido principal -->
    <main class="content-area" id="content-area">

      <!-- Bienvenida -->
      <section class="welcome-section" aria-labelledby="welcome-title">
        <h1 class="welcome-section__title" id="welcome-title">¡Bienvenido, User!</h1>
        <p  class="welcome-section__sub">
          Explora todos los cursos disponibles deslizando lateralmente.
        </p>
      </section>

      <!-- ── Sección: Cursos Destacados ── -->
      <section class="courses-section anim-fade-up delay-1" aria-label="Cursos Destacados">
        <div class="section-header">
          <h2 class="section-header__title">Cursos Destacados</h2>
          <button type="button" class="section-header__link" data-expand="featured"
                  aria-expanded="false" aria-controls="featured-track">Ver todos &rsaquo;</button>
        </div>
        <!-- Carrusel: tarjetas generadas por DashboardController -->
        <div class="carousel-track" id="featured-track" role="list" aria-label="Carrusel de cursos destacados">
          <!-- Skeleton placeholder mientras carga -->
          <div style="color:var(--clr-text-muted);font-size:.85rem;padding:1rem">Cargando cursos…</div>
        </div>
      </section>

      <!-- ── Sección: Continuar Aprendiendo ── -->
      <section class="courses-section anim-fade-up delay-2" aria-label="Continuar Aprendiendo">
        <div class="section-header">
          <h2 class="section-header__title">Continuar Aprendiendo</h2>
          <button type="button" class="section-header__link" data-expand="learning"
                  aria-expanded="false" aria-controls="learning-track">Ver todos &rsaquo;</button>
        </div>
        <div class="carousel-track" id="learning-track" role="list" aria-label="Carrusel de cursos en progreso">
        </div>
      </section>

      <!-- ── Sección: Recién Vistos ── -->
      <section class="courses-section anim-fade-up delay-3" aria-label="Recién Vistos">
        <div class="section-header">
          <h2 class="section-header__title">Recién Vistos</h2>
          <button type="button" class="section-header__link" data-expand="recent"
                  aria-expanded="false" aria-controls="recent-track">Ver más &rsaquo;</button>
        </div>
        <div class="carousel-track" id="recent-track" role="list" aria-label="Cursos visitados recientemente">
        </div>
      </section>

      <!-- ── Banner: IA ── -->
      <div class="ai-banner" id="ai-banner" role="button" tabindex="0"
           aria-label="Consultar al asistente de IA">
        <!-- Ícono izquierdo -->
        <svg class="ai-banner__icon" width="32" height="32" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        <p class="ai-banner__text">¿Tienes dudas? Consulta a nuestra Inteligencia Artificial</p>
        <!-- Ícono derecho -->
        <svg class="ai-banner__icon" width="32" height="32" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="10" rx="2"/>
          <circle cx="12" cy="5" r="2"/>
          <path d="M12 7v4"/>
          <line x1="8" y1="15" x2="8" y2="15"/>
          <line x1="16" y1="15" x2="16" y2="15"/>
        </svg>
      </div>

    </main><!-- /content-area -->
  </div><!-- /main-area -->

</div><!-- /dashboard -->

<!-- Scripts (orden importante: servicios → controladores) -->
<script src="src/js/services/DataService.js?v=20260704"></script>
<script src="src/js/services/UserProfileService.js?v=20260704"></script>
<script src="src/js/services/AppShell.js?v=20260704"></script>
<script src="src/js/controllers/SidebarController.js?v=20260613"></script>
<script src="src/js/controllers/DashboardController.js?v=20260704"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => DashboardController.init());
</script>

</body>
</html>

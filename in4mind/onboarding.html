<!DOCTYPE html>
<html lang="es" data-i18n-title="meta.onboardingTitle" data-requires-auth>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="IN4MIND — Elige tu objetivo de aprendizaje">
  <title>IN4MIND — Bienvenida</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="src/js/dist/boot.bundle.js?v=20260819ruta3"></script>

  <link rel="stylesheet" href="src/css/tokens.css?v=20260819ruta3">
  <link rel="stylesheet" href="src/css/base.css?v=20260819ruta3">
  <link rel="stylesheet" href="src/css/auth.css?v=20260819ruta3">
  <link rel="stylesheet" href="src/css/onboarding.css?v=20260819ruta3">
  <link rel="stylesheet" href="src/css/ui-polish.css?v=20260819ruta3">
  <link rel="stylesheet" href="src/css/i18n.css?v=20260819ruta3">
  <link rel="stylesheet" href="src/css/theme.css?v=20260819ruta3">
  <link rel="stylesheet" href="src/css/employable.css?v=20260819ruta3">
  <link rel="stylesheet" href="src/css/accessibility.css?v=20260819ruta3">

  <link rel="icon" type="image/png" sizes="64x64" href="src/img/brand/favicon-64.png">
  <link rel="apple-touch-icon" href="src/img/brand/apple-touch-icon.png">
</head>
<body>
<div class="ob-page auth-page ob-booting" id="ob-page">
  <div class="auth-bg" aria-hidden="true">
    <canvas class="auth-bg__canvas" id="auth-bg-canvas"></canvas>
  </div>

  <header class="auth-topbar">
    <a class="auth-topbar__brand" href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="9" y1="18" x2="15" y2="18"/>
        <line x1="10" y1="22" x2="14" y2="22"/>
        <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0018 8 6 6 0 006 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 018.91 14"/>
      </svg>
      IN4MIND
    </a>
    <div class="auth-topbar__actions">
      <span data-lang-switcher></span>
    </div>
  </header>

  <main class="ob-main">
    <div class="ob-hero">
      <p class="ob-kicker" id="ob-step-label" data-i18n="signupOnboard.step" data-i18n-params='{"n":1,"total":2}'>Paso 1 de 2</p>
      <h1 class="ob-title" data-i18n="signupOnboard.title">Empieza tu Ruta Empleable</h1>
      <p class="ob-sub" data-i18n="signupOnboard.sub">Elige una ruta (Web, Python, Datos, Office 365 o Ciberseguridad). Te llevamos al primer curso.</p>
    </div>

    <section class="ob-step" id="ob-step-1">
      <div class="ob-goals" id="ob-goals" role="list"></div>
      <div class="ob-actions">
        <button type="button" class="ob-skip" id="ob-skip" data-i18n="signupOnboard.skip">Saltar por ahora</button>
      </div>
    </section>

    <section class="ob-step" id="ob-step-2" hidden>
      <div class="ob-assign">
        <div class="ob-assign__pulse" aria-hidden="true"></div>
        <h2 id="ob-assign-title">Tu primer curso</h2>
        <p id="ob-assign-body">Te llevamos a la Lección 1 para empezar ahora.</p>
        <button type="button" class="btn btn--primary ob-start" id="ob-start-btn" data-i18n="signupOnboard.startLesson">
          Ir a la Lección 1
        </button>
      </div>
    </section>
  </main>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="src/js/config/supabase.config.js"></script>
<script defer src="src/js/dist/app-shell.bundle.js?v=20260819ruta3"></script>
<script defer src="src/js/components/AuthBackdrop.js?v=20260819ruta3"></script>
<script defer src="src/js/services/OnboardingService.js?v=20260819ruta3"></script>
<script defer src="src/js/data/CareerPathsData.js?v=20260819ruta3"></script>
<script defer src="src/js/services/EmployabilityService.js?v=20260819ruta3"></script>
<script defer src="src/js/controllers/OnboardingController.js?v=20260819ruta3"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => { void OnboardingController.init(); });
</script>
</body>
</html>

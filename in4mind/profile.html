  <link rel="stylesheet" href="src/css/app-features.css?v=20260713app">
  <link rel="manifest" href="manifest.json">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>%F0%9F%92%A1</text></svg>">
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

<div class="dashboard">

  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Menú principal">
    <div class="sidebar__brand">
      <div class="sidebar__brand-main">
        <svg class="sidebar__brand-icon" width="28" height="28" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="9" y1="18" x2="15" y2="18"/>
          <line x1="10" y1="22" x2="14" y2="22"/>
          <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0018 8 6 6 0 006 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 018.91 14"/>
        </svg>
        <span class="sidebar__brand-name">IN4MIND</span>
      </div>
      <button type="button" class="sidebar__collapse-btn" id="sidebar-collapse"
              aria-label="Colapsar menú" aria-expanded="true">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
    </div>

    <ul class="sidebar__nav" id="sidebar-nav" role="menubar" aria-label="Navegación principal"></ul>

    <div class="sidebar__footer">
      <ul id="sidebar-footer" role="menubar" aria-label="Opciones de cuenta"></ul>
    </div>
  </aside>

  <div class="main-area">

    <header class="topbar" role="banner">
      <button class="menu-toggle icon-btn" id="menu-toggle"
              aria-label="Abrir menú" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <div class="search-bar" role="search">
        <svg class="search-bar__icon" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input class="search-bar__input" type="search" id="search-input"
               placeholder="Buscar en guardados, favoritos y quizzes..."
               aria-label="Buscar en perfil">
      </div>

      <div class="topbar__actions">
        <a class="icon-btn" href="help.html" aria-label="Ayuda">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </a>
        <button class="icon-btn" aria-label="Notificaciones">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 01-3.46 0"/>
          </svg>
        </button>
        <a class="avatar" id="avatar" href="profile.html" aria-label="Ir a mi perfil">U</a>
      </div>
    </header>

    <main class="content-area content-area--profile prof-page--enter" id="content-area">

      <header class="prof-header">
        <div class="prof-header__main">
          <div class="prof-avatar-lg" id="profile-avatar-lg" aria-hidden="true">U</div>
          <div>
            <h1 class="prof-header__name" id="profile-name">Usuario</h1>
            <p class="prof-header__email" id="profile-email">usuario@email.com</p>
          </div>
        </div>
        <div class="prof-header__actions">
          <button type="button" class="prof-btn prof-btn--danger" id="profile-logout-btn" data-i18n="profile.logout">Cerrar sesión</button>
        </div>
      </header>

      <section class="prof-stats" data-i18n-aria="profile.activityAria" aria-label="Resumen de actividad">
        <article class="prof-stat-card prof-stat-card--saved prof-stat-card--active" data-tab-target="saved" tabindex="0" role="button" data-i18n-aria="profile.viewSaved" aria-label="Ver guardados">
          <div class="prof-stat-card__icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
          </div>
          <p class="prof-stat-card__label" data-i18n="profile.saved">Guardados</p>
          <p class="prof-stat-card__value" id="stat-saved-count">0 Elementos</p>
        </article>
        <article class="prof-stat-card prof-stat-card--fav" data-tab-target="favorites" tabindex="0" role="button" data-i18n-aria="profile.viewFav" aria-label="Ver favoritos">
          <div class="prof-stat-card__icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
          </div>
          <p class="prof-stat-card__label" data-i18n="profile.favorites">Favoritos</p>
          <p class="prof-stat-card__value" id="stat-fav-count">0 Elementos</p>
        </article>
        <article class="prof-stat-card prof-stat-card--quiz" data-tab-target="quizzes" tabindex="0" role="button" data-i18n-aria="profile.viewQuizStat" aria-label="Ver quizzes">
          <div class="prof-stat-card__icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <p class="prof-stat-card__label" data-i18n="profile.quizzes">Quizzes</p>
          <p class="prof-stat-card__value" id="stat-quiz-count">0 Completados</p>
        </article>
        <article class="prof-stat-card prof-stat-card--cert" data-tab-target="certifications" tabindex="0" role="button" data-i18n-aria="profile.viewCert" aria-label="Ver certificaciones">
          <div class="prof-stat-card__icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M8.21 13.89L7 23l5-3 5 3-1.21-9.12"/></svg>
          </div>
          <p class="prof-stat-card__label" data-i18n="profile.certifications">Certificaciones</p>
          <p class="prof-stat-card__value" id="stat-cert-count">0 Obtenidas</p>
        </article>
      </section>

      <div class="prof-tabs" role="tablist" data-i18n-aria="profile.contentAria" aria-label="Contenido del perfil">
        <button type="button" class="prof-tab" data-tab="progress" role="tab" aria-selected="false" data-i18n="profile.tabProgress">En progreso</button>
        <button type="button" class="prof-tab prof-tab--active" data-tab="saved" role="tab" aria-selected="true" data-i18n="profile.tabSaved">Elementos guardados</button>
        <button type="button" class="prof-tab" data-tab="favorites" role="tab" aria-selected="false" data-i18n="profile.tabFavorites">Favoritos</button>
        <button type="button" class="prof-tab" data-tab="quizzes" role="tab" aria-selected="false" data-i18n="profile.tabQuizzes">Quizzes realizados</button>
        <button type="button" class="prof-tab" data-tab="certifications" role="tab" aria-selected="false" data-i18n="profile.tabCerts">Certificaciones</button>
      </div>

      <div class="prof-list" id="profile-list" role="list"></div>

      <div class="prof-empty" id="profile-empty" hidden>
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
        </svg>
        <p data-i18n="profile.empty">Aún no hay contenido aquí.</p>
      </div>

    </main>
  </div>
</div>

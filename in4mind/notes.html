<html lang="es" data-i18n-title="meta.notesTitle" data-requires-auth>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IN4MIND — Mis notas de aprendizaje.">

  <link rel="stylesheet" href="src/css/tokens.css?v=20260702">
  <link rel="stylesheet" href="src/css/base.css?v=20260714fluid3">
  <link rel="stylesheet" href="src/css/dashboard.css?v=20260713amb">
  <link rel="stylesheet" href="src/css/responsive.css?v=20260613">

  <link rel="stylesheet" href="src/css/i18n.css?v=20260722">
  <link rel="stylesheet" href="src/css/settings-modal.css?v=20260714theme">
  <link rel="stylesheet" href="src/css/app-features.css?v=20260713app">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="64x64" href="src/img/brand/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="src/img/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="src/img/brand/favicon-16.png">
  <link rel="apple-touch-icon" href="src/img/brand/apple-touch-icon.png">
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

<div class="dashboard">
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Menú principal" data-i18n-aria="shell.mainMenu">
    <div class="sidebar__brand">
      <div class="sidebar__brand-main">
        <svg class="sidebar__brand-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="9" y1="18" x2="15" y2="18"/><line x1="10" y1="22" x2="14" y2="22"/>
          <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0018 8 6 6 0 006 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 018.91 14"/>
        </svg>
        <span class="sidebar__brand-name">IN4MIND</span>
      </div>
      <button type="button" class="sidebar__collapse-btn" id="sidebar-collapse" aria-label="Colapsar menú" data-i18n-aria="shell.collapseMenu" aria-expanded="true">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>
    <ul class="sidebar__nav" id="sidebar-nav" role="menubar" aria-label="Navegación principal" data-i18n-aria="shell.mainNav"></ul>
    <div class="sidebar__footer">
      <ul id="sidebar-footer" role="menubar" aria-label="Opciones de cuenta" data-i18n-aria="shell.accountOptions"></ul>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar" role="banner">
      <button class="menu-toggle icon-btn" id="menu-toggle" aria-label="Abrir menú" data-i18n-aria="shell.openMenu" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="search-bar" role="search">
        <svg class="search-bar__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-bar__input" type="search" id="notes-search" placeholder="Buscar una nota…" data-i18n-placeholder="notes.searchPlaceholder" aria-label="Buscar notas" data-i18n-aria="notes.searchAria">
      </div>
      <div class="topbar__actions">
        <button type="button" class="btn--quiz-share" id="notes-btn-share" data-share aria-label="Compartir" data-i18n-aria="share.notes">↗</button>
        <a class="icon-btn" href="help.html" aria-label="Ayuda" data-i18n-aria="shell.help">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </a>
        <a class="avatar" id="avatar" href="profile.html" aria-label="Ir a mi perfil" data-i18n-aria="shell.myProfile">U</a>
      </div>
    </header>

    <main class="content-area">
      <div class="notes-page-header anim-fade-up">
        <div class="notes-page-header__brand">
          <span class="in4mind-bulb notes-page-header__logo" aria-hidden="true"></span>
          <div>
            <h1 data-i18n="notes.pageTitle">Mis Notas</h1>
            <p style="color:var(--clr-text-muted);font-size:.85rem;margin:.25rem 0 0" data-i18n="notes.pageSub">Organiza tus apuntes de cursos y proyectos.</p>
          </div>
        </div>
        <div class="notes-page-header__actions">
          <button type="button" class="btn--course" id="notes-new-btn" data-i18n="notes.newNote">Nueva nota</button>
        </div>
      </div>

      <section class="anim-fade-up delay-1">
        <h2 class="notes-section-title" data-i18n="notes.recentFolders">Carpetas recientes</h2>
        <div class="notes-period-tabs" role="tablist">
          <button type="button" class="notes-period" data-notes-period="today" data-i18n="notes.today">Hoy</button>
          <button type="button" class="notes-period notes-period--active" data-notes-period="week" data-i18n="notes.thisWeek">Esta semana</button>
          <button type="button" class="notes-period" data-notes-period="month" data-i18n="notes.thisMonth">Este mes</button>
        </div>
        <div class="notes-folders-grid" id="notes-folders-grid"></div>
      </section>

      <section class="anim-fade-up delay-2">
        <h2 class="notes-section-title" data-i18n="notes.myNotes">Mis notas</h2>
        <nav class="notes-filter-nav" id="notes-filter-nav" aria-label="Filtrar notas"></nav>
        <div class="notes-grid" id="notes-grid" role="list"></div>
      </section>
    </main>
  </div>
</div>

<div class="notes-editor-overlay" id="notes-editor-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="notes-editor-heading">
  <div class="notes-editor">
    <h2 id="notes-editor-heading" class="visually-hidden" data-i18n="notes.editNote">Editar nota</h2>
    <input class="notes-editor__title" id="notes-editor-title" placeholder="Título de la nota" data-i18n-placeholder="notes.titlePlaceholder">
    <textarea class="notes-editor__content" id="notes-editor-content" placeholder="Escribe aquí…" data-i18n-placeholder="notes.contentPlaceholder"></textarea>
    <input class="notes-editor__tags" id="notes-editor-tags" placeholder="Etiquetas separadas por coma" data-i18n-placeholder="notes.tagsPlaceholder">
    <div class="notes-editor__colors" id="notes-editor-colors"></div>
    <div class="notes-editor__actions">
      <button type="button" class="btn--course" id="notes-editor-save" data-i18n="common.save">Guardar</button>
      <button type="button" class="btn--outline" id="notes-editor-cancel" data-i18n="common.cancel">Cancelar</button>
      <button type="button" class="notes-editor__delete" id="notes-editor-delete" data-i18n="common.delete">Eliminar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="src/js/services/DataService.js?v=20260805"></script>
<script src="src/js/services/UserProfileService.js?v=20260811progress"></script>
<script src="src/js/services/LessonNotesService.js?v=20260807"></script>
<script src="src/js/services/NotesService.js?v=20260807"></script>
<script src="src/js/services/GlobalSearchService.js?v=20260706c"></script>
<script src="src/js/services/AccessibilityService.js?v=20260707"></script>
<script src="src/js/controllers/AppFeatures.js?v=20260706d"></script>
<script src="src/js/services/AppShell.js?v=20260807"></script>
<script src="src/js/controllers/SidebarController.js?v=20260713app"></script>
<script src="src/js/services/AuthService.js?v=20260807"></script>
<script src="src/js/controllers/OtherMenuController.js?v=20260714theme"></script>
<script src="src/js/controllers/SettingsController.js?v=20260731"></script>
<script src="src/js/controllers/NotesController.js?v=20260807"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    try { AppShell.initPage('notes'); } catch (e) { console.error(e); AppShell.setupAvatar(); }
    try { NotesController.init(); } catch (e) { console.error(e); }
  });
</script>
</body>
</html>
